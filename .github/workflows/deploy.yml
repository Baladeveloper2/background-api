name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: production_deploy

    steps:
      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            echo "🛡️ Configure Git Safe Directory"
            git config --global --add safe.directory /var/www/myproject/background-api
            
            echo "🔄 Fetch and Reset Code"
            cd /var/www/myproject/background-api
            git fetch origin main
            git reset --hard origin/main
            echo "Code updated to: $(git log -1 --oneline)"
            
            echo "🔍 Debug Environment"
            echo "=== Environment Info ==="
            echo "Working dir: $(pwd)"
            echo "Python3: $(python3 --version)"
            echo "GCC: $(gcc --version | head -1)"
            echo "Venv exists: $(test -d /var/www/myproject/venv && echo YES || echo NO)"
            
            echo "🐍 Ensure Virtual Environment Exists"
            if [ ! -d "/var/www/myproject/venv" ]; then
              echo "Creating new virtual environment..."
              python3 -m venv /var/www/myproject/venv
            fi
            
            echo "📦 Install Python Dependencies"
            source /var/www/myproject/venv/bin/activate
            pip install --upgrade pip -q
            pip install -r requirements.txt -q
            pip install cython setuptools -q
            
            echo "🔒 Compile with Cython (Hide Source Code)"
            python setup_cython.py build_ext --inplace
            
            echo "🧹 Remove Python Source Files"
            find app/ -name "*.py" ! -name "__init__.py" ! -name "database.py" -delete
            rm -rf build/
            find app/ -name "*.c" -delete
            
            echo "🚀 Restart Systemd Service"
            sudo systemctl restart background-api.service
            
            echo "✅ Verify Service Status"
            sleep 3
            sudo systemctl is-active background-api.service

